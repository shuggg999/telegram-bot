[project]
name = "telegram-bot"
version = "0.1.0"
description = "HTTP webhook receiver that forwards alerts to Telegram Bot API."
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
